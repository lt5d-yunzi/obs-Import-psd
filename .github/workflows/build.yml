name: build

on:
  push:
    branches: [main, windows]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Fetch third-party headers
        run: ./fetch-deps.sh
        env:
          # No OBS.app on the runner; the script falls back to Homebrew Qt.
          QT_DIR: ""

      - name: Fetch OBS frameworks
        run: |
          # The plugin links libobs and obs-frontend-api at build time, so a
          # matching OBS release has to be present on the runner.
          set -euo pipefail
          OBS_VER=32.2.2
          curl -fsSL -o obs.dmg \
            "https://github.com/obsproject/obs-studio/releases/download/${OBS_VER}/OBS-Studio-${OBS_VER}-macOS-Apple.dmg"
          hdiutil attach obs.dmg -mountpoint /tmp/obs -nobrowse -quiet
          sudo cp -R "/tmp/obs/OBS.app" /Applications/
          hdiutil detach /tmp/obs -quiet

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./tests/run_all.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent obs-psd.plugin \
            "obs-psd-macos-arm64-${GITHUB_SHA::8}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-psd-macos-arm64
          path: build/obs-psd-macos-arm64-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare third_party (OBS headers, Qt 6, miniz, stb)
        shell: pwsh
        run: |
          # build-win.ps1 expects a specific third_party layout:
          #   obs-src\libobs\obs.h, qt6\include|lib|bin, miniz\*, stb_image_write.h
          $tp = "third_party"
          New-Item -ItemType Directory -Force -Path $tp | Out-Null

          Write-Output "== OBS 32.2.2 headers =="
          git clone --depth 1 --branch 32.2.2 https://github.com/obsproject/obs-studio "$tp/obs-src"

          Write-Output "== OBS dependencies (portable OBS for obs.dll + oss 导入库) =="
          $obsVer = '32.2.2'
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$obsVer/OBS-Studio-$obsVer-Windows-x64.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs -Force

          Write-Output "== Qt 6 from obs-deps =="
          # Use the same Qt build OBS 32.2.2 ships with, so the ABI matches.
          $deps = '2026-07-15'
          Invoke-WebRequest "https://github.com/obsproject/obs-deps/releases/download/$deps/windows-deps-qt6-$deps-x64.zip" -OutFile qt6.zip
          Expand-Archive qt6.zip -DestinationPath "$tp/qt6-extract" -Force
          # The archive unpacks to a single top-level dir; flatten it.
          $inner = Get-ChildItem "$tp/qt6-extract" -Directory | Select-Object -First 1
          Move-Item $inner.FullName "$tp/qt6"
          Remove-Item "$tp/qt6-extract" -Recurse -Force

          Write-Output "== miniz + stb =="
          git clone --depth 1 https://github.com/richgel999/miniz "$tp/miniz-src"
          New-Item -ItemType Directory -Force -Path "$tp/miniz" | Out-Null
          # miniz_export.h is generated by upstream CMake and is not in the repo;
          # write the empty version (miniz is linked in, not a DLL).
          $files = @("miniz.c","miniz.h","miniz_tdef.c","miniz_tdef.h","miniz_tinfl.c","miniz_tinfl.h","miniz_common.h")
          foreach ($f in $files) { Copy-Item "$tp/miniz-src/$f" "$tp/miniz/$f" }
          $exportHeader = @(
            '/* Generated by CI - miniz is compiled into the plugin, so nothing to export. */'
            '#ifndef MINIZ_EXPORT'
            '#define MINIZ_EXPORT'
            '#endif'
          )
          Set-Content -Path "$tp/miniz/miniz_export.h" -Value $exportHeader
          Invoke-WebRequest "https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h" -OutFile "$tp/stb_image_write.h"

      - name: Build
        shell: pwsh
        run: |
          $obs = (Get-ChildItem obs -Directory | Select-Object -First 1).FullName
          ./build-win.ps1 -ObsDir $obs -QtRoot "$PWD/third_party/qt6"

      - name: Package
        shell: pwsh
        run: |
          $dll = "build-win/Release/obs-psd.dll"
          if (-not (Test-Path $dll)) { throw "$dll not found" }
          $zip = "obs-psd-windows-x64-$($env:GITHUB_SHA.Substring(0,8)).zip"
          # Ship the DLL with its locale files, matching the layout OBS expects.
          New-Item -ItemType Directory -Force -Path stage/obs-psd/data/obs-plugins/obs-psd/locale | Out-Null
          Copy-Item $dll stage/obs-psd/
          Copy-Item data/locale/*.ini stage/obs-psd/data/obs-plugins/obs-psd/locale/
          Compress-Archive -Path stage/obs-psd -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: obs-psd-windows-x64
          path: obs-psd-windows-x64-*.zip
          if-no-files-found: error
