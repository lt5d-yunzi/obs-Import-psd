name: test

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The PSD codec has no OBS or Qt dependency, so it builds and tests anywhere
  # with a C++ compiler. This job gives fast feedback on every push without
  # waiting for the full platform builds.
  codec:
    name: PSD codec tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch third-party headers
        run: ./fetch-deps.sh
        env:
          QT_LIB_DIR: ""
          # The codec only needs miniz and stb; skip the Qt/OBS parts if the
          # script cannot find them on this runner.
          SKIP_OBS_HEADERS: "1"
          SKIP_QT_HEADERS: "1"

      - name: Build and run the codec tests
        run: |
          set -euo pipefail
          FLAGS="-std=c++17 -O2 -Isrc -Ithird_party/miniz"
          C_SRCS="third_party/miniz/miniz.c third_party/miniz/miniz_tdef.c \
                  third_party/miniz/miniz_tinfl.c third_party/miniz/miniz_zip.c"
          CXX_SRCS="src/psd/psd_read.cpp src/psd/psd_write.cpp src/psd/psd_buf.cpp \
                    src/psd/rle.cpp src/psd/psd_text.cpp src/psd/psd_descriptor.cpp"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Some SDKs ship a broken libSystem.tbd (tapi: malformed file);
            # pick the newest one that actually links.
            SDK=""
            for cand in $(ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk 2>/dev/null | sort -rV); do
              if grep -q "arm64e-macos" "$cand/usr/lib/libSystem.tbd" 2>/dev/null; then
                continue
              fi
              SDK="$cand"
              break
            done
            [ -n "$SDK" ] || SDK="$(xcrun --show-sdk-path)"
            SYSROOT="-isysroot $SDK"
            LINK="-Xlinker -ld_classic"
          else
            SYSROOT=""
            LINK=""
          fi
          mkdir -p out
          # miniz is C: compiling it as C++ rejects its const array declaration.
          for f in $C_SRCS; do
            cc -std=c11 -O2 -Ithird_party/miniz $SYSROOT -c "$f" -o "out/$(basename "$f").o"
          done
          for f in $CXX_SRCS tests/psd_test.cpp; do
            c++ $FLAGS $SYSROOT -c "$f" -o "out/$(basename "$f").o"
          done
          c++ out/*.o -o out/psd_test $LINK
          ./out/psd_test
